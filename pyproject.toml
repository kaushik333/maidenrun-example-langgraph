[project]
name = "research-agent"
version = "0.1.0"
description = "Minimal LangGraph research agent used as a test fixture for the Agent Feedback Deploy platform"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "gradio>=5.0",
    "ddgs>=9.0",
    "tavily-python>=0.5",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
